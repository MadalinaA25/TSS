  <text x="23" y="668" font-size="11" font-family="monospace" fill="#1a1a1a">Cai independente (baza V(G)=3):</text>
  <text x="23" y="685" font-size="11" font-family="monospace" fill="#1a1a1a">  P1: N1→N2→N3→N4→N8    (zeta &lt; 1  → "subdampat")</text>
  <text x="23" y="702" font-size="11" font-family="monospace" fill="#1a1a1a">  P2: N1→N2→N3→N5→N6→N8  (zeta = 1  → "critic")</text>
  <text x="23" y="719" font-size="11" font-family="monospace" fill="#1a1a1a">  P3: N1→N2→N3→N5→N7→N8  (zeta &gt; 1  → "supradampat")</text>
