  <path d="M 523 280 C 560 280 560 625 258 625" stroke="#1E8449" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <path d="M 516 390 C 550 390 550 625 258 625" stroke="#1E8449" stroke-width="1.3" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
