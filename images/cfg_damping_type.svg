  <text x="287" y="384" font-size="11" font-weight="bold" font-family="Arial" fill="#7D3C98">T</text>
  <line x1="195" y1="419" x2="195" y2="478" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="199" y="448" font-size="11" font-weight="bold" font-family="Arial" fill="#7D3C98">F</text>
