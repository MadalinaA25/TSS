  <text x="23" y="713" font-size="11" font-family="monospace" fill="#1a1a1a">Cai independente (baza V(G)=4):</text>
  <text x="23" y="730" font-size="11" font-family="monospace" fill="#1a1a1a">  P1: N1→N2→N3→N9            (t_max invalid → ValueError)</text>
  <text x="23" y="747" font-size="11" font-family="monospace" fill="#1a1a1a">  P2: N1→N2→N4→N5→N9         (dt invalid → ValueError)</text>
  <text x="23" y="764" font-size="11" font-family="monospace" fill="#1a1a1a">  P3: N1→N2→N4→N6→N7→N9      (dt &gt;= t_max → ValueError)</text>
  <text x="23" y="781" font-size="11" font-family="monospace" fill="#1a1a1a">  P4: N1→N2→N4→N6→N8→N9      (toti valizi → simulare)</text>
