  <text x="325" y="28" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial" fill="#1a1a1a">CFG: MassSpringDamper.simulate(x0, v0, t_max, dt)</text>
  <text x="325" y="46" text-anchor="middle" font-size="12" font-family="Arial" fill="#555555">N=9  E=11  P=1  →  V(G) = 11 − 9 + 2·1 = 4</text>
